<style>
#xg{--ink:#0f172a;--navy:#132046;--blue:#2563eb;--orange:#f97316;--red:#dc2626;--green:#16a34a;--amber:#d97706;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;
  font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);max-width:1240px;margin:0 auto;padding:16px}
#xg *{box-sizing:border-box}
#xg h2,#xg h3,#xg p{margin:0}
#xg button{font:inherit;line-height:1.2}
#xg a{color:var(--blue)}
#xg svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* header */
#xg .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
#xg .brand{display:flex;align-items:center;gap:12px}
#xg .brand img{width:42px;height:42px}
#xg .brand .n{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
#xg .brand .n b{color:var(--orange)}
#xg .brand .s{font-size:12px;color:var(--muted)}
#xg .top .r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#xg .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;white-space:nowrap}
#xg .pill.ok{background:#dcfce7;color:#15803d}#xg .pill.bad{background:#fee2e2;color:#b91c1c}#xg .pill.warn{background:#fef3c7;color:#b45309}
#xg .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
/* navigation */
#xg .nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px;scrollbar-width:thin}
#xg .nav button{display:flex;align-items:center;gap:7px;border:0;background:none;border-radius:10px;padding:9px 14px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
#xg .nav button:hover{background:var(--soft);color:var(--ink)}
#xg .nav button.on{background:var(--navy);color:#fff}
#xg .nav .cnt{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
/* layout */
#xg .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
#xg .two{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:16px}
#xg .three{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);margin-bottom:16px}
#xg .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
#xg .two .card,#xg .three .card,#xg .grid .card{margin-bottom:0}
#xg .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
#xg .head h3{font-size:16px;font-weight:700;color:var(--navy)}
#xg .head .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#xg .muted{color:var(--muted)}#xg .small{font-size:12px}
#xg .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
#xg .red{color:var(--red)!important}#xg .green{color:var(--green)!important}#xg .amber{color:var(--amber)!important}
/* stat cards */
#xg .stat{display:flex;gap:14px;align-items:flex-start}
#xg .stat .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
#xg .stat .ic svg.i{width:22px;height:22px}
#xg .ic.blue{background:#dbeafe;color:#1d4ed8}#xg .ic.orange{background:#ffedd5;color:#c2410c}#xg .ic.red{background:#fee2e2;color:#b91c1c}#xg .ic.green{background:#dcfce7;color:#15803d}#xg .ic.violet{background:#ede9fe;color:#6d28d9}#xg .ic.slate{background:#f1f5f9;color:#334155}
#xg .stat .v{font-size:26px;font-weight:800;line-height:1.1;color:var(--navy)}
#xg .stat .l{color:var(--muted);font-size:13px;margin-top:2px}
#xg .trend{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
#xg .trend.up{background:#fee2e2;color:#b91c1c}#xg .trend.down{background:#dcfce7;color:#15803d}#xg .trend.flat{background:#f1f5f9;color:#64748b}
/* banner */
#xg .banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:16px;padding:20px 22px;margin-bottom:16px;color:#fff}
#xg .banner.ok{background:linear-gradient(120deg,#15803d,#22c55e)}
#xg .banner.bad{background:linear-gradient(120deg,#b91c1c,#f97316)}
#xg .banner .big{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
#xg .banner .big svg.i{width:28px;height:28px}
#xg .banner h2{font-size:20px;font-weight:800}
#xg .banner p{opacity:.9;font-size:13px;margin-top:2px}
#xg .banner .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#xg .banner .btn{background:#fff;color:var(--ink);border-color:#fff}
#xg .banner .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
/* buttons and inputs */
#xg .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
#xg .btn:hover{filter:brightness(1.12)}
#xg .btn.o{background:#fff;color:var(--navy);border-color:#cbd5e1}
#xg .btn.o:hover{background:var(--soft);filter:none}
#xg .btn.d{background:var(--red);border-color:var(--red)}
#xg .btn.g{background:var(--green);border-color:var(--green)}
#xg .btn.sm{padding:5px 10px;font-size:12px}
#xg .btn:disabled{opacity:.45;cursor:default;filter:none}
#xg input[type=text],#xg input[type=number],#xg input[type=search],#xg select{border:1px solid #cbd5e1;border-radius:10px;padding:8px 11px;font-size:13px;background:#fff;color:var(--ink);height:36px}
#xg input:focus,#xg select:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
#xg .search{position:relative;display:flex;align-items:center}
#xg .search svg.i{position:absolute;left:10px;color:#94a3b8;width:16px;height:16px}
#xg .search input{padding-left:32px;min-width:240px}
#xg .chips{display:flex;gap:6px;flex-wrap:wrap}
#xg .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
#xg .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* tables */
#xg .tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
#xg table{width:100%;border-collapse:collapse;font-size:13px}
#xg th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:9px 8px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
#xg td{padding:10px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
#xg tr:hover td{background:#fcfdfe}
#xg td.path{word-break:break-all;min-width:220px}
#xg td.nw{white-space:nowrap}
#xg .badge{display:inline-block;white-space:nowrap;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:#f1f5f9;color:#475569;text-transform:capitalize}
#xg .b-detected,#xg .b-virus,#xg .b-failed,#xg .b-high,#xg .b-critical,#xg .b-denied{background:#fee2e2;color:#b91c1c}
#xg .b-quarantined,#xg .b-blocked{background:#e0e7ff;color:#3730a3}
#xg .b-running,#xg .b-queued{background:#dbeafe;color:#1d4ed8}
#xg .b-completed,#xg .b-restored,#xg .b-ok,#xg .b-low{background:#dcfce7;color:#15803d}
#xg .b-suspicious,#xg .b-medium,#xg .b-stopped,#xg .b-disabled{background:#fef3c7;color:#b45309}
#xg .empty{padding:34px 16px;text-align:center;color:var(--muted)}
#xg .empty svg.i{width:34px;height:34px;color:#cbd5e1;display:block;margin:0 auto 8px}
#xg .pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--muted)}
#xg .selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:8px 12px;margin-bottom:12px}
#xg .selbar b{color:#1d4ed8}
/* scanner */
#xg .sc{display:flex;flex-direction:column;gap:10px}
#xg .sc .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
#xg .sc h3{font-size:16px;font-weight:700;color:var(--navy)}
#xg .sc p{color:var(--muted);font-size:13px;flex:1}
#xg .sc .last{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
#xg .run{border:1px solid #bfdbfe;background:linear-gradient(180deg,#eff6ff,#fff)}
#xg .bar{height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:10px 0 6px}
#xg .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#38bdf8);border-radius:999px;transition:width .4s}
#xg .bar.ind i{width:35%!important;animation:xgind 1.2s ease-in-out infinite}
@keyframes xgind{0%{margin-left:-35%}100%{margin-left:100%}}
#xg .spin{width:16px;height:16px;border:2px solid #bfdbfe;border-top-color:var(--blue);border-radius:50%;animation:xgspin .8s linear infinite;display:inline-block}
@keyframes xgspin{to{transform:rotate(360deg)}}
/* skeleton */
#xg .sk{background:linear-gradient(90deg,#f1f5f9,#e2e8f0,#f1f5f9);background-size:200% 100%;animation:xgsk 1.2s infinite;border-radius:10px}
@keyframes xgsk{to{background-position:-200% 0}}
/* chart */
#xg svg.chart{width:100%;height:170px;display:block}
#xg .axis{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-top:4px}
/* list */
#xg .li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f1f5f9}
#xg .li:last-child{border-bottom:0}
#xg .li .p{flex:1;min-width:0;word-break:break-all}
/* toast */
#xg .toasts{position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:380px}
#xg .toast{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 12px 30px rgba(15,23,42,.25);font-size:13px;animation:xgpop .15s ease-out}
#xg .toast.ok svg.i{color:#4ade80}#xg .toast.err svg.i{color:#f87171}
@keyframes xgpop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* directory picker */
#xg .pick{position:relative;color:var(--ink);text-align:left}
#xg .pick-btn{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:13px;color:var(--ink);text-align:left;height:36px}
#xg .pick-btn .ph{color:var(--muted)}#xg .pick-btn .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#xg .pick-btn .car{transition:transform .15s;color:var(--muted)}#xg .pick.open .pick-btn .car{transform:rotate(180deg)}
#xg .pick-pop{display:none;position:absolute;z-index:60;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(15,23,42,.18);overflow:hidden}
#xg .pick.open .pick-pop{display:block;animation:xgpop .12s ease-out}
#xg .pick-s{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--soft);color:var(--muted)}
#xg .pick-s input{flex:1;border:0!important;background:none!important;padding:2px 0!important;outline:none!important;height:auto!important}
#xg .pick-list{max-height:260px;overflow:auto;padding:6px}
#xg .pick-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
#xg .pick-i svg{flex:none;color:#0ea5e9}#xg .pick-i .p{flex:1;min-width:0;word-break:break-all}#xg .pick-i .p i{font-style:normal;color:#94a3b8}
#xg .pick-i:hover,#xg .pick-i.hl{background:#eff6ff}#xg .pick-i.sel{background:#e0f2fe;font-weight:600}
#xg .pick-i .ck{visibility:hidden;color:#0284c7}#xg .pick-i.sel .ck{visibility:visible}
#xg .pick-n{padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--soft)}
#xg .pick-e{padding:18px;text-align:center;color:var(--muted);font-size:13px}
@media (max-width:900px){#xg .two,#xg .three{grid-template-columns:1fr}#xg .search input{min-width:0;width:100%}#xg .search{flex:1}}
</style>
<div id="xg">
  <div class="top">
    <div class="brand"><img src="__ICON__" alt=""><div><div class="n"><b>xP</b>Guard</div><div class="s" id="xg-sub">Proactive server security</div></div></div>
    <div class="r"><span id="xg-state"></span><span class="pill" id="xg-ver" style="display:none"></span></div>
  </div>
  <div class="nav" id="xg-nav"></div>
  <div id="xg-body"></div>
  <div class="toasts" id="xg-toasts"></div>
</div>
<script>
(function () {
  var MODE = "__MODE__"; // whm | cpanel
  var ENDPOINT = window.location.pathname;
  var root = document.getElementById('xg');
  var body = document.getElementById('xg-body');
  var PAGE = 25;

  // Every page load gets a new generation. Answers and timers of a page the
  // visitor already left are dropped instead of writing into the new page.
  var gen = 0, timers = [];

  var P = {
    home: 'M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-6h4v6',
    scan: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20.5 20.5 16 16',
    file: 'M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8zM14 3v5h5M12 11v4M12 18h.01',
    logs: 'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01',
    cms: 'M12 3 2.5 8 12 13l9.5-5zM2.5 12.5 12 17.5l9.5-5M2.5 16.5 12 21.5l9.5-5',
    shield: 'M12 3 4.5 6v5.5c0 4.7 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.8 7.5-9.5V6z',
    check: 'M12 3 4.5 6v5.5c0 4.7 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.8 7.5-9.5V6zM8.5 12l2.5 2.5 4.5-5',
    alert: 'M12 3 2 20h20zM12 10v4M12 17h.01',
    bot: 'M5 9h14v10H5zM12 5v4M12 5h.01M9 13.5h.01M15 13.5h.01M9.5 16.5h5M3 13v3M21 13v3',
    wall: 'M3 5h18v14H3zM3 9.7h18M3 14.3h18M8 5v4.7M16 5v4.7M12 9.7v4.6M8 14.3V19M16 14.3V19',
    globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9M12 3c-2.5 2.6-3.7 5.6-3.7 9s1.2 6.4 3.7 9',
    box: 'M4 7.5 12 3l8 4.5v9L12 21l-8-4.5zM4 7.5l8 4.5 8-4.5M12 12v9',
    bolt: 'M13 3 5 13.5h6L10 21l8-10.5h-6z',
    folder: 'M3.5 6.5A1.5 1.5 0 0 1 5 5h4.5l2 2.5H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z',
    play: 'M7 4.5v15l12-7.5z',
    stop: 'M6.5 6.5h11v11h-11z',
    refresh: 'M20 11a8 8 0 0 0-14.8-3.5M4 4v4h4M4 13a8 8 0 0 0 14.8 3.5M20 20v-4h-4',
    ok: 'M5 12.5 10 17.5 19.5 7',
    x: 'M6 6l12 12M18 6 6 18',
    lock: 'M6 11h12v9.5H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3',
    target: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
    left: 'M15 5l-7 7 7 7', right: 'M9 5l7 7-7 7'
  };
  function ic(n, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24"><path d="' + P[n] + '"/></svg>'; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function when(ts) { return ts ? new Date(ts * 1000).toLocaleString() : '–'; }
  function ago(ts) {
    if (!ts) return 'never';
    var s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    return Math.floor(s / 86400) + ' days ago';
  }
  function dur(a, b) {
    if (!a || !b || b < a) return '';
    var s = b - a;
    return s < 60 ? s + ' s' : s < 3600 ? Math.floor(s / 60) + ' min ' + (s % 60) + ' s' : Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min';
  }
  function num(n) { return (n || 0).toLocaleString(); }
  function badge(v, cls) { return '<span class="badge b-' + esc(cls || v) + '">' + esc(v) + '</span>'; }
  function $(id) { return document.getElementById(id); }
  // set writes into an element only while it is still on the page.
  function set(id, html) { var el = $(id); if (el) el.innerHTML = html; return el; }
  function text(id, t) { var el = $(id); if (el) el.textContent = t; }
  function empty(msg, icon) { return '<div class="empty">' + ic(icon || 'box') + esc(msg) + '</div>'; }

  function toast(msg, ok) {
    var box = $('xg-toasts'); if (!box) return;
    var t = document.createElement('div');
    t.className = 'toast ' + (ok ? 'ok' : 'err');
    t.innerHTML = ic(ok ? 'ok' : 'alert') + '<div>' + esc(msg) + '</div>';
    box.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 6000);
  }

  // jsonEnd returns where the first JSON value in text ends (-1 if none).
  function jsonEnd(text) {
    var i = text.search(/[{\[]/), depth = 0, str = false;
    if (i < 0) return -1;
    for (; i < text.length; i++) {
      var c = text[i];
      if (str) {
        if (c === '\\') i++;
        else if (c === '"') str = false;
        continue;
      }
      if (c === '"') str = true;
      else if (c === '{' || c === '[') depth++;
      else if (c === '}' || c === ']') { depth--; if (depth === 0) return i + 1; }
    }
    return -1;
  }

  // parseResp reads the agent's answer. Some panel servers add output after
  // it (notices, injected scripts): only the first JSON value counts.
  function parseResp(text) {
    try { return JSON.parse(text); } catch (e) {}
    var start = text.search(/[{\[]/), end = jsonEnd(text);
    if (start >= 0 && end > start) {
      try { return JSON.parse(text.slice(start, end)); } catch (e) {}
    }
    throw new Error('Unexpected response from the server: ' + text.slice(0, 200));
  }

  // transient reports errors worth one more try: the service restarting
  // (updates), a dropped connection or a page the server answered instead.
  function transient(e) {
    return e && (e.retry || /not available right now|no response|Unexpected response|Failed to fetch|NetworkError|Load failed/i.test(e.message || ''));
  }

  function callOnce(action, params) {
    return fetch(ENDPOINT, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action, params: params || {} })
    }).then(function (r) { return r.text(); }).then(parseResp).then(function (r) {
      if (!r.ok) { var e = new Error(r.error || 'request failed'); e.retry = !!r.retry; throw e; }
      return r.data;
    });
  }

  // api retries twice (after 1.5 s and 4 s) when the failure is transient.
  function api(action, params) {
    var waits = [1500, 4000];
    function attempt(i) {
      return callOnce(action, params).catch(function (e) {
        if (i >= waits.length || !transient(e)) throw e;
        return new Promise(function (ok) { setTimeout(ok, waits[i]); }).then(function () { return attempt(i + 1); });
      });
    }
    return attempt(0);
  }

  // call is api for the page on screen: once the visitor moves on, its
  // answer is dropped (the promise rejects with a "stale" error).
  function call(action, params) {
    var g = gen;

  // picker turns el into a searchable folder list. Paths under home are

    body.innerHTML = '<div class="card"><div class="head"><h3>Detected files</h3><span class="muted small" id="xg-count"></span><div class="r">' +
      searchBox('xg-q', fState.q, 'Search file or detection') + '</div></div>' +
      '<div class="chips" id="xg-st" style="margin-bottom:12px">' + sts.map(function (s) { return '<button class="chip' + (fState.status === s[0] ? ' on' : '') + '" data-st="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div>' +
      '<div class="selbar" id="xg-sel" style="display:none"><span><b id="xg-n">0</b> selected</span>' +
      acts.map(function (a) { return '<button class="btn sm ' + (a === 'delete' ? 'd' : 'o') + '" data-act="' + a + '">' + a.charAt(0).toUpperCase() + a.slice(1) + '</button>'; }).join('') + '</div>' +
      '<div id="xg-list"></div></div>';
    $('xg-st').onclick = function (e) {
      var b = e.target.closest ? e.target.closest('[data-st]') : null; if (!b) return;
      fState.status = b.getAttribute('data-st'); fState.offset = 0;
      body.querySelectorAll('[data-st]').forEach(function (c) { c.className = 'chip' + (c === b ? ' on' : ''); });
      load().catch(quiet);
    };
    bindSearch('xg-q', function (v) { fState.q = v; fState.offset = 0; load().catch(quiet); });
    function selected() { return Array.prototype.map.call(body.querySelectorAll('input[data-id]:checked'), function (c) { return Number(c.getAttribute('data-id')); }); }
    function updSel() { var n = selected().length; var s = $('xg-sel'); if (s) s.style.display = n ? '' : 'none'; text('xg-n', n); }
    $('xg-sel').onclick = function (e) {
      var b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
      var act = b.getAttribute('data-act'), ids = selected();
      if (!ids.length) return;
      if (act === 'delete' && !confirm('Permanently delete ' + ids.length + ' file(s)? This cannot be undone.')) return;
      b.disabled = true;
      api('finding.action', { ids: ids, action: act }).then(function (r) {
        var failed = Object.keys(r.failed || {});
        toast(r.done + ' file(s): ' + act + ' done' + (failed.length ? ', ' + failed.length + ' failed: ' + r.failed[failed[0]] : ''), !failed.length);
        return load();
      }).catch(quiet).then(function () { b.disabled = false; });
    };
    var list = $('xg-list');
    list.addEventListener('change', function (e) {
      if (e.target.id === 'xg-all') body.querySelectorAll('input[data-id]').forEach(function (c) { c.checked = e.target.checked; });
      updSel();
    });
    onPage(list, function (o) { fState.offset = o; load().catch(quiet); });
    function load() {
      return call('findings.list', { status: fState.status, q: fState.q, limit: PAGE, offset: fState.offset }).then(function (d) {
        var fs = d.findings || [];
        text('xg-count', num(d.total) + ' file(s)');
        set('xg-list', fs.length ? '<div class="tw"><table><tr><th style="width:28px"><input type="checkbox" id="xg-all"></th><th>File</th><th>Detection</th><th>Status</th>' + (MODE === 'whm' ? '<th>Owner</th>' : '') + '<th>Found</th></tr>' +
          fs.map(function (f) {
            return '<tr><td><input type="checkbox" data-id="' + f.id + '"></td><td class="mono path">' + esc(f.path) + '</td><td>' + badge(f.category) + '<div class="muted mono small" style="margin-top:3px">' + esc(f.signature) + '</div></td><td>' + badge(f.status) + '</td>' +
              (MODE === 'whm' ? '<td>' + esc(f.owner) + '</td>' : '') + '<td class="nw" title="' + esc(when(f.created_at)) + '">' + ago(f.created_at) + '</td></tr>';
          }).join('') + '</table></div>' + pager(d.total, fState.offset, PAGE)
          : empty(fState.status || fState.q ? 'No files match this filter' : 'No detected files. Your account is clean.', 'check'));
        updSel();
      });
    }
    return load();
  };

  /* ---------------- scanner logs ---------------- */

  var lState = { q: '', offset: 0 };
  PAGES.logs = function () {
    body.innerHTML = '<div class="card"><div class="head"><h3>Background scanner logs</h3><span class="muted small">Realtime and scheduled scans</span><div class="r">' +
      searchBox('xg-q', lState.q, 'Search name, category or description') + '</div></div><div id="xg-list"></div></div>';
    bindSearch('xg-q', function (v) { lState.q = v; lState.offset = 0; load().catch(quiet); });
    onPage($('xg-list'), function (o) { lState.offset = o; load().catch(quiet); });
    function load() {
      return call('findings.list', { source: 'background', q: lState.q, limit: PAGE, offset: lState.offset }).then(function (d) {
        var fs = d.findings || [];
        set('xg-list', fs.length ? '<div class="tw"><table><tr><th>File</th><th>Category</th><th>Virus description</th><th>Status</th><th>Time</th></tr>' +
          fs.map(function (f) {
            return '<tr><td class="mono path">' + esc(f.path) + '</td><td>' + badge(f.category) + '</td><td class="mono">' + esc(f.signature) + '</td><td>' + badge(f.status) + '</td><td class="nw">' + when(f.created_at) + '</td></tr>';
          }).join('') + '</table></div>' + pager(d.total, lState.offset, PAGE) : empty('Nothing found by the background scanner', 'check'));
      });
    }
    return load();
  };

  /* ---------------- CMS ---------------- */

  PAGES.cms = function () {
    return call('cms.list', { limit: 200 }).then(function (d) {
      var sites = d.sites || [];
      body.innerHTML = '<div class="card"><div class="head"><h3>CMS threats</h3><span class="muted small">WordPress, Joomla and OpenCart sites of your account</span></div>' +
        (sites.length ? '<div class="tw"><table><tr><th>Website</th><th>CMS</th><th>Version</th><th>Core files</th><th>Database</th><th>Vulnerable</th><th>Outdated</th><th>Risk</th></tr>' +
        sites.map(function (s) {
          var cell = function (n) { return '<td class="' + (n ? 'red' : 'green') + '"><b>' + num(n) + '</b></td>'; };
          return '<tr><td><b>' + esc(s.domain || s.path) + '</b><div class="muted mono small">' + esc(s.path) + '</div></td><td>' + esc(s.type) + '</td><td class="nw">' + esc(s.version) +
            (s.latest && s.latest !== s.version ? '<div class="amber small">latest ' + esc(s.latest) + '</div>' : '') + '</td>' + cell(s.core_issues) + cell(s.db_issues) + cell(s.vulnerable) +
            '<td>' + num((s.outdated_plugins || 0) + (s.outdated_themes || 0)) + '</td><td>' + badge(s.risk || 'ok') + '</td></tr>';
        }).join('') + '</table></div>' : empty('No WordPress, Joomla or OpenCart sites found yet', 'cms')) + '</div>';
    });
  };

  /* ---------------- WAF and bots ---------------- */

  var wState = { waf: { q: '', offset: 0 }, bot: { q: '', offset: 0 } };
  function wafPage(cat) {
    var st = wState[cat];
    var title = cat === 'bot' ? 'Bot attacks' : 'WAF logs', sub = cat === 'bot' ? 'Bad bots and crawlers stopped on your websites' : 'Web attacks the firewall stopped on your websites. If one of them was you, send the rule number to your host: it can be allowed for your website only.';
    body.innerHTML = '<div class="card"><div class="head"><h3>' + title + '</h3><span class="muted small">' + sub + '</span><div class="r">' +
      searchBox('xg-q', st.q, 'Search IP, domain, URI…') + '</div></div><div id="xg-list"></div></div>';
    bindSearch('xg-q', function (v) { st.q = v; st.offset = 0; load().catch(quiet); });
    onPage($('xg-list'), function (o) { st.offset = o; load().catch(quiet); });
    function load() {
      return call('waf.events', { category: cat, q: st.q, limit: PAGE, offset: st.offset }).then(function (d) {
        var ev = d.events || [];
        set('xg-list', ev.length ? '<div class="tw"><table><tr><th>Time</th><th>IP address</th><th>Website</th><th>Reason</th><th>Action</th></tr>' +
          ev.map(function (e) {
            return '<tr><td class="nw">' + when(e.at) + '</td><td class="mono nw">' + esc(e.ip) + '</td><td class="path"><b>' + esc(e.host) + '</b><div class="muted mono small">' + esc(e.method) + ' ' + esc(e.uri) + '</div></td><td>' + esc(e.msg) +
              '<div class="muted small">Rule ' + esc(e.rule_id) + (e.detail && e.detail.indexOf('Matched rules: ') === 0 ? ' · ' + esc(e.detail.slice(15)) : '') + '</div>' +
              '</td><td title="' + esc(e.action) + '">' + actionBadge(e.action) + '</td></tr>';
          }).join('') + '</table></div>' + pager(d.total, st.offset, PAGE) : empty(st.q ? 'No events match your search' : 'No attacks recorded. Nice and quiet.', 'shield'));
      });
    }
    return load();
  }
  // actionBadge shortens ModSecurity's "Access denied with code 403".
  function actionBadge(a) {
    var m = /code (\d+)/i.exec(a || '');
    if (/denied|block/i.test(a || '')) return badge('Blocked' + (m ? ' ' + m[1] : ''), 'denied');
    return badge(a || 'logged', 'x');
  }
  PAGES.waf = function () { return wafPage('waf'); };
  PAGES.bots = function () { return wafPage('bot'); };

  /* ---------------- WHM ---------------- */

  PAGES.overview = function () {
    return call('overview').then(function (d) {
      header(d);
      var s = d.summary.scanner, fw = d.summary.firewall, ip = d.ipdb;
      text('xg-sub', 'Connected to ' + d.portal);
      badgeCount = s.open_findings || 0; nav('overview');
      state(s.open_findings ? 'bad' : 'ok', s.open_findings ? 'Action needed' : 'Protected');
      var row = function (name, ok, label, extra) {
        return '<div class="li"><div class="ic ' + (ok ? 'green' : 'red') + '" style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center">' + ic(ok ? 'ok' : 'x') + '</div><div class="p"><b>' + esc(name) + '</b><div class="muted small">' + extra + '</div></div>' + badge(label, ok ? 'ok' : 'failed') + '</div>';
      };
      body.innerHTML = '<div class="grid">' +
        stat('file', s.open_findings ? 'red' : 'green', num(s.open_findings), 'Open detections') +
        stat('lock', 'violet', num(s.quarantined), 'Quarantined files') +
        stat('shield', 'blue', num(s.threats_30d), 'Threats (30 days)') +
        stat('wall', 'orange', num(fw.active_blocks), 'Blocked IPs') +
        stat('globe', 'slate', num(ip.entries), 'IPDB addresses') +
        stat('target', 'red', num(ip.hits_today), 'IPDB drops today') + '</div>' +
        '<div class="card"><div class="head"><h3>Status</h3></div>' +
        row('Virus scanner', d.scanner, d.scanner ? 'running' : 'disabled', d.realtime ? 'Realtime protection on' : 'Realtime protection off') +
        row('Firewall', d.firewall.healthy, d.firewall.healthy ? 'active' : 'inactive', esc(d.firewall.provider) + (d.firewall.error ? ' · ' + esc(d.firewall.error) : '')) +
        row('IPDB', ip.enabled, ip.enabled ? 'protecting' : 'off', 'List ' + esc(ip.version || 'not received yet')) +
        '<div class="li"><div class="ic blue" style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center">' + ic('globe') + '</div><div class="p"><b>Portal</b><div class="muted small"><a href="' + esc(d.portal) + '" target="_blank" rel="noreferrer">' + esc(d.portal) + '</a> · full dashboard, settings and history</div></div></div></div>';
    });
  };

  PAGES.firewall = function () {
    body.innerHTML = '<div class="card"><div class="head"><h3>Block or allow an IP</h3></div><div class="head" style="margin:0">' +
      '<input type="text" id="xg-ip" placeholder="IP or CIDR"><select id="xg-kind"><option value="deny">Block permanently</option><option value="tempban">Block temporarily</option><option value="allow">Allow (whitelist)</option><option value="ignore">Ignore (never auto-block)</option></select>' +
      '<input type="number" id="xg-min" value="60" style="width:90px" title="minutes (temporary blocks)"><input type="text" id="xg-note" placeholder="comment" style="flex:1;min-width:160px">' +
      '<button class="btn" id="xg-add">Apply</button><button class="btn o" id="xg-chk">Check IP</button><button class="btn o" id="xg-unb">Unblock IP</button></div><div id="xg-res" style="margin-top:10px"></div></div>' +
      '<div class="card"><div class="head"><h3>Recent blocks</h3></div><div id="xg-ev"></div></div>';
    var ip = function () { return $('xg-ip').value.trim(); };
    var load = function () {
      return call('fw.events', { limit: 100 }).then(function (d) {
        var ev = d.events || [];
        set('xg-ev', ev.length ? '<div class="tw"><table><tr><th>IP</th><th>Reason</th><th>Source</th><th>Status</th><th>When</th><th>Expires</th></tr>' + ev.map(function (e) {
          return '<tr><td class="mono nw">' + esc(e.ip) + '</td><td>' + esc(e.reason) + '</td><td>' + esc(e.source) + '</td><td>' + badge(e.status) + '</td><td class="nw">' + when(e.created_at) + '</td><td class="nw">' + (e.expires_at ? when(e.expires_at) : 'never') + '</td></tr>';
        }).join('') + '</table></div>' : empty('No blocks yet', 'wall'));
      });
    };
    $('xg-add').onclick = function () {
      api('fw.add', { kind: $('xg-kind').value, addr: ip(), comment: $('xg-note').value, minutes: Number($('xg-min').value) })
        .then(function () { toast('Saved', true); return load(); }).catch(quiet);
    };
    $('xg-unb').onclick = function () {
      api('fw.unblock', { Addr: ip() }).then(function () { toast(ip() + ' unblocked', true); return load(); }).catch(quiet);
    };
    $('xg-chk').onclick = function () {
      api('fw.check', { IP: ip() }).then(function (r) {
        set('xg-res', '<b class="mono">' + esc(r.ip) + '</b>: ' + badge(r.status) + (r.protected ? ' <span class="muted">(this server / portal — never blocked)</span>' : ''));
      }).catch(quiet);
    };
    return load();
  };

  PAGES.ipdb = function () {
    var draw = function () {
      return call('ipdb.status').then(function (d) {
        var cc = Object.keys(d.countries || {}).sort(function (a, b) { return d.countries[b] - d.countries[a]; }).slice(0, 10);
        var top = cc.length ? d.countries[cc[0]] : 1;
        var rows = function (list) {
          return list.length ? '<div class="tw"><table><tr><th>Address</th><th>Country</th><th>Packets</th><th>Last seen</th></tr>' + list.map(function (h) {
            return '<tr><td class="mono">' + esc(h.entry) + '</td><td>' + esc(h.country || '??') + '</td><td>' + num(h.hits) + '</td><td class="nw">' + when(h.last_seen) + '</td></tr>';
          }).join('') + '</table></div>' : empty('No blocked traffic yet', 'globe');
        };
        body.innerHTML = '<div class="grid">' + stat('globe', d.enabled ? 'green' : 'orange', d.enabled ? 'On' : 'Off', 'IPDB protection') +
          stat('logs', 'blue', num(d.entries), 'Addresses in the list') + stat('target', 'red', num(d.hits_today), 'Packets dropped today') + stat('wall', 'slate', num(d.hits_total), 'Packets dropped (total)') + '</div>' +
          '<div class="two"><div class="card"><div class="head"><h3>Top countries</h3><span class="r muted small">30 days</span></div>' + (cc.length ? cc.map(function (c) {
            return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><b>' + esc(c || '??') + '</b><span class="muted">' + num(d.countries[c]) + '</span></div><div class="bar" style="margin:4px 0 0;height:6px"><i style="width:' + Math.max(2, Math.round(d.countries[c] * 100 / top)) + '%"></i></div></div>';
          }).join('') : empty('No data yet', 'globe')) + '</div>' +
          '<div class="card"><div class="head"><h3>Recently blocked</h3><span class="r muted small">refreshes every 15 s</span></div>' + rows(d.recent || []) + '</div></div>' +
          '<p class="muted small">The live map and list management are in the portal.</p>';
      });
    };
    every(15000, function () { draw().catch(quiet); });
    return draw();
  };

  window.addEventListener('hashchange', function () {
    var n = location.hash.replace(/^#\/?/, '');
    if (PAGES[n] && n !== current) show(n);
  });
  var first = location.hash.replace(/^#\/?/, '');
  var allowed = TABS.some(function (t) { return t[0] === first; });
  show(allowed ? first : TABS[0][0]);
})();
</script>
