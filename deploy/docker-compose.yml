# XMart Guard portal stack: PostgreSQL + portal (+ Caddy for automatic HTTPS
# on servers without a web server).
#   Plain VPS:      docker compose --profile caddy up -d --build
#   cPanel server:  docker compose up -d --build   (Apache proxies to 127.0.0.1:18080)
# deploy/setup-almalinux.sh picks the right mode automatically.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xmartguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: xmartguard
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmartguard"]
      interval: 5s
      retries: 20

  portal:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://xmartguard:${POSTGRES_PASSWORD}@db:5432/xmartguard
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      TRUST_PROXY: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      # Only reachable from this host; the public web server proxies to it.
      - "127.0.0.1:${PORTAL_PORT:-18080}:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [portal]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  caddy_data:
  caddy_config:
